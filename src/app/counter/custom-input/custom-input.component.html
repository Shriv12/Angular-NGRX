<div class="app-custom-value">
    <button class="toggle-btn-container" (click)="toggleClicked()">
        <span class="toggle-btn" >{{ (showCustomValue$ | async) ? '-' : "+" }}</span>
    </button>

    <div class="custom-input-container" *ngIf = "(showCustomValue$ | async)">
        <input type="text" [(ngModel)] = "customValue">
        <button class="btn-increment-by"
        (click) = "onCustomeValueBtnClicked()"
        >
            Increment By
        </button>
    </div>
</div>
